<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dipti AI — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <style>
    :root {
      --bg:        #0d1117;
      --bg2:       #161b22;
      --bg3:       #1e2530;
      --bg4:       #252d3a;
      --input-bg:  #161b22;
      --border:    #21262d;
      --border2:   #30363d;
      --text:      #e6edf3;
      --text2:     #8b949e;
      --text3:     #484f58;
      --green:     #0de4a0;
      --green2:    #0ac48a;
      --green-bg:  rgba(13,228,160,.08);
      --amber:     #f0a030;
      --blue:      #4d7fff;
      --danger:    #f85149;
      --radius:    14px;
      --radius-sm: 10px;
      --radius-xs: 7px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Sora', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    /* ── CARD ── */
    .card {
      background: var(--bg2);
      border: 0.5px solid var(--border2);
      border-radius: 18px;
      padding: 32px 28px;
      box-shadow: 0 12px 48px rgba(0,0,0,.55);
    }

    /* ── LOGO ── */
    .logo {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .logo-icon {
      width: 72px; height: 72px;
      border-radius: 20px;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px;
      overflow: hidden;
      box-shadow: 0 6px 28px rgba(0,0,0,.6);
    }

    .logo-icon img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 20px;
    }

    .logo h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -.5px;
    }

    .logo p {
      font-size: 0.8rem;
      color: var(--text2);
      margin-top: 4px;
    }

    /* ── TABS ── */
    .tabs {
      display: flex;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 1.25rem;
    }

    .tab {
      flex: 1;
      padding: 9px;
      text-align: center;
      border-radius: var(--radius-xs);
      cursor: pointer;
      font-size: 0.88rem;
      color: var(--text2);
      font-family: 'Sora', sans-serif;
      font-weight: 500;
      transition: all 0.18s;
      border: none;
      background: transparent;
    }

    .tab.active {
      background: var(--bg4);
      color: var(--text);
      font-weight: 600;
    }

    /* ── GOOGLE BUTTON ── */
    .btn-google {
      width: 100%;
      padding: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'Sora', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }

    .btn-google:hover { background: var(--bg4); border-color: var(--border); }
    .btn-google:disabled { opacity: .6; cursor: not-allowed; }

    /* ── DIVIDER ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0;
      color: var(--text3);
      font-size: 0.78rem;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border2);
    }

    /* ── FORM ── */
    .form-group { margin-bottom: 0.95rem; }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text2);
      margin-bottom: 5px;
      font-weight: 500;
    }

    /* ── INPUT WITH ICON ── */
    .field-wrap { position: relative; }

    .field-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text3);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    input {
      width: 100%;
      padding: 11px 13px;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.92rem;
      font-family: 'Sora', sans-serif;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
    }

    input.has-left-icon  { padding-left: 38px; }
    input.has-right-icon { padding-right: 42px; }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(13,228,160,.1);
    }

    input::placeholder { color: var(--text3); }

    /* ── EYE TOGGLE ── */
    .toggle-eye {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text3);
      padding: 4px;
      display: flex;
      align-items: center;
      transition: color .15s;
    }

    .toggle-eye:hover { color: var(--text2); }

    /* ── FORGOT ── */
    .forgot-row {
      text-align: right;
      margin-top: -4px;
      margin-bottom: 14px;
    }

    .forgot-row button {
      background: none;
      border: none;
      color: var(--blue);
      font-size: 0.78rem;
      cursor: pointer;
      font-family: 'Sora', sans-serif;
    }

    /* ── PRIMARY BUTTON ── */
    .btn {
      width: 100%;
      padding: 13px;
      background: var(--green);
      color: #0d1117;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.93rem;
      font-weight: 700;
      font-family: 'Sora', sans-serif;
      cursor: pointer;
      margin-top: 2px;
      transition: all 0.15s;
    }

    .btn:hover { background: var(--green2); transform: translateY(-1px); }

    .btn:disabled {
      background: var(--border2);
      cursor: not-allowed;
      transform: none;
      color: var(--text3);
    }

    /* ── MESSAGES ── */
    .error {
      background: rgba(248,81,73,.08);
      border: 1px solid rgba(248,81,73,.2);
      color: var(--danger);
      padding: 9px 13px;
      border-radius: var(--radius-xs);
      font-size: 0.82rem;
      margin-bottom: 12px;
      display: none;
    }

    .success {
      background: var(--green-bg);
      border: 1px solid rgba(13,228,160,.2);
      color: var(--green);
      padding: 9px 13px;
      border-radius: var(--radius-xs);
      font-size: 0.82rem;
      margin-bottom: 12px;
      display: none;
    }

    /* ── FREE BADGE ── */
    .free-badge {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.76rem;
      color: var(--text3);
    }

    .free-badge span { color: var(--amber); font-weight: 600; }

    /* ── VERIFY SCREEN ── */
    #verify-screen { display: none; text-align: center; }
    .verify-icon { font-size: 40px; margin-bottom: 14px; }
    #verify-screen h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; }
    #verify-screen p { font-size: 0.85rem; color: var(--text2); line-height: 1.8; margin-bottom: 18px; }
    #verify-screen p strong { color: var(--blue); }
    .code-inputs { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
    .code-input {
      width: 42px; height: 50px;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 20px; font-weight: 700;
      text-align: center;
      font-family: monospace;
      outline: none;
      transition: border-color 0.18s;
    }
    .code-input:focus { border-color: var(--green); }
    .resend-row { margin-top: 10px; font-size: 0.8rem; color: var(--text3); }
    .resend-row button { background: none; border: none; color: var(--blue); cursor: pointer; font-size: 0.8rem; font-family: 'Sora', sans-serif; }
    .back-link { margin-top: 10px; }
    .back-link button { background: none; border: none; color: var(--text2); font-size: 0.8rem; cursor: pointer; font-family: 'Sora', sans-serif; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">

      <!-- ══════════════════════ AUTH SCREEN ══════════════════════ -->
      <div id="auth-screen">

        <div class="logo">
          <div class="logo-icon">
            <img src="/static/Dipti AI-logo.png" alt="Dipti AI logo" />
          </div>
          <h1>Dipti AI</h1>
          <p>NCTB AI Tutor · Class 1–12 · বাংলা &amp; English</p>
        </div>

        <div class="tabs">
          <button class="tab active" onclick="switchTab('login')">Login</button>
          <button class="tab" onclick="switchTab('register')">Register</button>
        </div>

        <div id="error-box" class="error"></div>
        <div id="success-box" class="success"></div>

        <!-- Google OAuth button -->
        <button class="btn-google" id="google-btn" onclick="googleLogin()">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66 2.84-.84-.68z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>

        <div class="divider"><span>or</span></div>

        <!-- Name (register only) -->
        <div class="form-group" id="register-name" style="display:none;">
          <label>Your Name</label>
          <div class="field-wrap">
            <span class="field-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input type="text" id="name" class="has-left-icon" placeholder="e.g. Tasnim Zara" />
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label>Email</label>
          <div class="field-wrap">
            <span class="field-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </span>
            <input type="email" id="email" class="has-left-icon" placeholder="example@gmail.com"
                   onkeydown="if(event.key==='Enter')handleSubmit()" />
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label>Password</label>
          <div class="field-wrap">
            <span class="field-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="password" class="has-left-icon has-right-icon"
                   placeholder="At least 6 characters"
                   onkeydown="if(event.key==='Enter')handleSubmit()" />
            <button type="button" class="toggle-eye" id="eye-btn" onclick="toggleEye()" aria-label="Show/hide password">
              <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="forgot-row" id="forgot-row">
          <button onclick="window.location.href='/?forgot=1'">Forgot password?</button>
        </div>

        <button class="btn" id="submit-btn" onclick="handleSubmit()">Login</button>

        <div class="free-badge">
          Free plan — <span>10 questions/day</span> at no cost
        </div>
      </div>

      <!-- ══════════════════════ VERIFY EMAIL SCREEN ══════════════════════ -->
      <div id="verify-screen">
        <div class="verify-icon">📧</div>
        <h2>Check your email!</h2>
        <p>We sent a 6-digit code to<br><strong id="verify-email-label">your email</strong><br>Enter it below to verify.</p>
        <div id="verify-error" class="error"></div>
        <div id="verify-success" class="success"></div>
        <div class="code-inputs">
          <input class="code-input" maxlength="1" id="c1" oninput="codeIn(this,null,'c2')" onkeydown="codeKey(event,this,null,'c2')">
          <input class="code-input" maxlength="1" id="c2" oninput="codeIn(this,'c1','c3')" onkeydown="codeKey(event,this,'c1','c3')">
          <input class="code-input" maxlength="1" id="c3" oninput="codeIn(this,'c2','c4')" onkeydown="codeKey(event,this,'c2','c4')">
          <input class="code-input" maxlength="1" id="c4" oninput="codeIn(this,'c3','c5')" onkeydown="codeKey(event,this,'c3','c5')">
          <input class="code-input" maxlength="1" id="c5" oninput="codeIn(this,'c4','c6')" onkeydown="codeKey(event,this,'c4','c6')">
          <input class="code-input" maxlength="1" id="c6" oninput="codeIn(this,'c5',null)" onkeydown="codeKey(event,this,'c5',null)">
        </div>
        <button class="btn" id="verify-btn" onclick="submitVerify()">Verify Email ✓</button>
        <div class="resend-row">Didn't get it? <button id="resend-btn" onclick="resendCode()">Resend code</button></div>
        <div class="back-link"><button onclick="backToAuth()">← Back</button></div>
      </div>

    </div><!-- /.card -->
  </div><!-- /.container -->

  <script>
    // ── Supabase client (Google OAuth only) ──
    const _sb = window.supabase.createClient('{{ supabase_url }}', '{{ supabase_anon_key }}');

    // ── Google OAuth ──
    async function googleLogin() {
      const btn = document.getElementById('google-btn');
      btn.disabled = true;
      btn.textContent = 'Redirecting to Google...';
      try {
        const { error } = await _sb.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin + '/auth/callback' }
        });
        if (error) {
          showError('Google login failed. Please try again.');
          btn.disabled = false;
          btn.innerHTML = _googleBtnInner();
        }
      } catch(e) {
        showError('Google login failed. Please try again.');
        btn.disabled = false;
        btn.innerHTML = _googleBtnInner();
      }
    }

    function _googleBtnInner() {
      return `<svg width="18" height="18" viewBox="0 0 24 24">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66 2.84-.84-.68z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg> Continue with Google`;
    }

    // ── Eye toggle ──
    let _pwVisible = false;
    function toggleEye() {
      _pwVisible = !_pwVisible;
      const inp = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      inp.type = _pwVisible ? 'text' : 'password';
      icon.innerHTML = _pwVisible
        ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
        : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    }

    // ── Show Google error from OAuth callback redirect ──
    const _qp = new URLSearchParams(window.location.search);
    if (_qp.get('error')) showError('Google sign-in was cancelled or failed. Please try again.');

    // ── Existing auth logic (all IDs and function names preserved) ──
    let currentTab = 'login';
    let verifyEmail = '';
    let verifySubmitting = false;

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
      });
      document.getElementById('register-name').style.display = tab === 'register' ? 'block' : 'none';
      document.getElementById('forgot-row').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('submit-btn').textContent = tab === 'login' ? 'Login' : 'Create Account';
      clearMessages();
    }

    function showError(msg) {
      const box = document.getElementById('error-box');
      box.textContent = msg; box.style.display = 'block';
      document.getElementById('success-box').style.display = 'none';
    }
    function showSuccess(msg) {
      const box = document.getElementById('success-box');
      box.textContent = msg; box.style.display = 'block';
      document.getElementById('error-box').style.display = 'none';
    }
    function clearMessages() {
      document.getElementById('error-box').style.display = 'none';
      document.getElementById('success-box').style.display = 'none';
    }

    async function handleSubmit() {
      clearMessages();
      const btn = document.getElementById('submit-btn');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const name = document.getElementById('name').value.trim();

      if (!email || !password) { showError('Please enter your email and password.'); return; }
      if (currentTab === 'register' && !name) { showError('Please enter your name.'); return; }

      btn.disabled = true;
      btn.textContent = 'Please wait...';

      const url = currentTab === 'login' ? '/login' : '/register';
      const body = currentTab === 'login' ? { email, password } : { name, email, password };

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();

        if (data.success) {
          if (data.needs_verification) {
            verifyEmail = email;
            showVerifyScreen(email);
          } else {
            showSuccess(currentTab === 'login'
              ? `Welcome back, ${data.name}! 👋`
              : 'Account created! ✓ Redirecting...');
            setTimeout(() => window.location.href = '/', 1200);
          }
        } else {
          showError(data.error || 'Something went wrong. Please try again.');
        }
      } catch (e) {
        showError('Network error. Please check your connection.');
      } finally {
        btn.disabled = false;
        btn.textContent = currentTab === 'login' ? 'Login' : 'Create Account';
      }
    }

    function showVerifyScreen(email) {
      verifyEmail = email; verifySubmitting = false;
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('verify-screen').style.display = 'block';
      const label = document.getElementById('verify-email-label');
      if (label) label.textContent = email;
      document.getElementById('verify-error').style.display = 'none';
      document.getElementById('verify-success').style.display = 'none';
      ['c1','c2','c3','c4','c5','c6'].forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; });
      const vBtn = document.getElementById('verify-btn');
      if (vBtn) { vBtn.disabled = false; vBtn.textContent = 'Verify Email ✓'; }
      setTimeout(() => document.getElementById('c1')?.focus(), 200);
    }

    function backToAuth() {
      document.getElementById('auth-screen').style.display = 'block';
      document.getElementById('verify-screen').style.display = 'none';
    }

    function codeIn(el, prevId, nextId) {
      el.value = el.value.replace(/[^0-9]/g, '');
      if (el.value && nextId) document.getElementById(nextId)?.focus();
      const code = ['c1','c2','c3','c4','c5','c6'].map(id => document.getElementById(id)?.value || '').join('');
      if (code.length === 6 && !verifySubmitting) submitVerify();
    }
    function codeKey(e, el, prevId, nextId) {
      if (e.key === 'Backspace' && !el.value && prevId) document.getElementById(prevId)?.focus();
      if (e.key === 'ArrowLeft' && prevId) document.getElementById(prevId)?.focus();
      if (e.key === 'ArrowRight' && nextId) document.getElementById(nextId)?.focus();
    }

    async function submitVerify() {
      if (verifySubmitting) return;
      const code = ['c1','c2','c3','c4','c5','c6'].map(id => document.getElementById(id)?.value || '').join('');
      if (code.length < 6) return;
      verifySubmitting = true;
      const btn = document.getElementById('verify-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Verifying...'; }
      document.getElementById('verify-error').style.display = 'none';
      document.getElementById('verify-success').style.display = 'none';
      try {
        const res = await fetch('/verify-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: verifyEmail, code })
        });
        const data = await res.json();
        if (data.success) {
          const box = document.getElementById('verify-success');
          if (box) { box.textContent = '✓ Email verified! Redirecting...'; box.style.display = 'block'; }
          setTimeout(() => window.location.href = '/', 1400);
        } else {
          const box = document.getElementById('verify-error');
          if (box) { box.textContent = data.error || 'Invalid code.'; box.style.display = 'block'; }
          if (btn) { btn.disabled = false; btn.textContent = 'Verify Email ✓'; }
          verifySubmitting = false;
        }
      } catch (e) {
        const box = document.getElementById('verify-error');
        if (box) { box.textContent = 'Server error. Please try again.'; box.style.display = 'block'; }
        if (btn) { btn.disabled = false; btn.textContent = 'Verify Email ✓'; }
        verifySubmitting = false;
      }
    }

    async function resendCode() {
      const btn = document.getElementById('resend-btn');
      if (!btn) return;
      btn.disabled = true; btn.textContent = 'Sending...';
      try {
        const res = await fetch('/resend-verification', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: verifyEmail })
        });
        const data = await res.json();
        if (data.success) {
          verifySubmitting = false;
          const vBtn = document.getElementById('verify-btn');
          if (vBtn) { vBtn.disabled = false; vBtn.textContent = 'Verify Email ✓'; }
          btn.textContent = '✓ Sent!';
          setTimeout(() => { btn.disabled = false; btn.textContent = 'Resend code'; }, 3000);
        } else {
          btn.textContent = 'Failed';
          setTimeout(() => { btn.disabled = false; btn.textContent = 'Resend code'; }, 2000);
        }
      } catch (e) {
        btn.disabled = false; btn.textContent = 'Resend code';
      }
    }
  </script>
</body>
