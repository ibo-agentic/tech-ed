<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dipti AI — Signing in...</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    body { background:#0d1117; color:#e6edf3; font-family:'Segoe UI',sans-serif;
           display:flex; align-items:center; justify-content:center; min-height:100vh;
           margin:0; flex-direction:column; gap:16px; }
    .spinner { width:32px; height:32px; border:3px solid #30363d;
               border-top-color:#0de4a0; border-radius:50%;
               animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    p { font-size:14px; color:#8b949e; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Signing you in with Google...</p>
  <script>
    const _sb = window.supabase.createClient('{{ supabase_url }}', '{{ supabase_anon_key }}');

    (async () => {
      try {
        const params = new URLSearchParams(window.location.search);

        // Error from Google / Supabase
        if (params.get('error')) {
          window.location.href = '/login-page?error=google_denied';
          return;
        }

        // PKCE flow: exchange code → session (Supabase JS handles verifier from localStorage)
        const code = params.get('code');
        if (code) {
          const { data, error } = await _sb.auth.exchangeCodeForSession(code);
          if (error || !data?.session) { window.location.href = '/login-page?error=google'; return; }
          await _finishLogin(data.session.user);
          return;
        }

        // Implicit flow fallback: tokens in URL fragment
        const { data, error } = await _sb.auth.getSession();
        if (error || !data?.session) { window.location.href = '/login-page?error=google'; return; }
        await _finishLogin(data.session.user);

      } catch(e) {
        console.error('[auth_callback]', e);
        window.location.href = '/login-page?error=google';
      }
    })();

    async function _finishLogin(user) {
      const name = user.user_metadata?.full_name
                || user.user_metadata?.name
                || user.email.split('@')[0];
      const res = await fetch('/auth/google-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: user.id, email: user.email, name })
      });
      const json = await res.json();
      window.location.href = json.success ? '/' : '/login-page?error=google';
    }
  </script>
</body>
</html>
