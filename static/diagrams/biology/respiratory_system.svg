<svg viewBox="0 0 380 480" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width:380px;background:#0d1117;border-radius:12px;font-family:'Noto Sans Bengali',sans-serif;">
  <defs>
    <style>
      svg * { transform-box:fill-box; transform-origin:center; }
      .breathe-lung { animation: breathe 4s infinite alternate ease-in-out; }
      .breathe-alveoli { animation: breathe 3s infinite alternate ease-in-out; }

      @keyframes breathe {
        0% { transform: scale(0.96); }
        100% { transform: scale(1.04); }
      }
    </style>

    <path id="p-air-in" d="M 180 50 L 180 135 C 180 145, 160 155, 145 170" fill="none" stroke="none" />
    <path id="p-air-out" d="M 235 170 C 220 155, 200 145, 200 135 L 200 50" fill="none" stroke="none" />

    <path id="p-micro-o2" d="M 190 290 L 190 350 C 190 380, 225 390, 235 415" fill="none" stroke="none" />
    <path id="p-micro-co2" d="M 145 415 C 155 390, 190 380, 190 350 L 190 290" fill="none" stroke="none" />

    <path id="p-rbc" d="M 80 370 C 130 460, 250 460, 300 370" fill="none" stroke="none" />

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f0a030" />
    </marker>
    <marker id="arrow-o2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#6bbbff" />
    </marker>
    <marker id="arrow-co2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f0a030" />
    </marker>

    <linearGradient id="cap-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6bbbff"/>
      <stop offset="30%" stop-color="#6bbbff"/>
      <stop offset="70%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <text x="190" y="30" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="bold">শ্বাসতন্ত্র (Respiratory System)</text>

  <text x="180" y="45" text-anchor="end" fill="#6bbbff" font-size="10">O₂ প্রবেশ</text>
  <text x="200" y="45" text-anchor="start" fill="#f0a030" font-size="10">CO₂ নির্গমন</text>

  <g id="macro-view">
    <g opacity="0.6">
      <line x1="175" y1="60" x2="205" y2="60" stroke="#0de4a0" stroke-width="2"/>
      <line x1="175" y1="70" x2="205" y2="70" stroke="#0de4a0" stroke-width="2"/>
      <line x1="175" y1="80" x2="205" y2="80" stroke="#0de4a0" stroke-width="2"/>
      <line x1="175" y1="90" x2="205" y2="90" stroke="#0de4a0" stroke-width="2"/>
      <line x1="175" y1="100" x2="205" y2="100" stroke="#0de4a0" stroke-width="2"/>
      <line x1="175" y1="110" x2="205" y2="110" stroke="#0de4a0" stroke-width="2"/>
      <line x1="175" y1="120" x2="205" y2="120" stroke="#0de4a0" stroke-width="2"/>
    </g>
    <path d="M 175 50 L 175 135 C 175 150, 135 170, 135 170" fill="none" stroke="#0de4a0" stroke-width="3"/>
    <path d="M 205 50 L 205 135 C 205 150, 245 170, 245 170" fill="none" stroke="#0de4a0" stroke-width="3"/>

    <g class="breathe-lung">
      <path d="M 170 120 C 130 90, 85 160, 100 230 C 115 245, 155 245, 170 215 Z" fill="#0d1117" stroke="#0de4a0" stroke-width="2.5" />
      <path d="M 135 170 C 120 185, 110 200, 115 220" fill="none" stroke="#0de4a0" stroke-width="1.5" opacity="0.4"/>
      <path d="M 135 170 C 145 190, 155 200, 160 210" fill="none" stroke="#0de4a0" stroke-width="1.5" opacity="0.4"/>

      <path d="M 210 120 C 250 90, 295 160, 280 230 C 265 245, 225 245, 210 215 Z" fill="#0d1117" stroke="#0de4a0" stroke-width="2.5" />
      <path d="M 245 170 C 260 185, 270 200, 265 220" fill="none" stroke="#0de4a0" stroke-width="1.5" opacity="0.4"/>
      <path d="M 245 170 C 235 190, 225 200, 220 210" fill="none" stroke="#0de4a0" stroke-width="1.5" opacity="0.4"/>
    </g>

    <text x="80" y="80" text-anchor="end" fill="#e6edf3" font-size="11" font-weight="bold">শ্বাসনালী</text>
    <text x="80" y="93" text-anchor="end" fill="#0de4a0" font-size="10">(Trachea)</text>
    <path d="M 85 85 L 165 85" fill="none" stroke="#f0a030" stroke-width="1" marker-end="url(#arrow)" />

    <text x="300" y="160" text-anchor="start" fill="#e6edf3" font-size="11" font-weight="bold">ফুসফুস</text>
    <text x="300" y="173" text-anchor="start" fill="#0de4a0" font-size="10">(Lung)</text>
    <path d="M 295 165 L 265 165" fill="none" stroke="#f0a030" stroke-width="1" marker-end="url(#arrow)" />

    <circle r="3.5" fill="#6bbbff" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2s" begin="0s" repeatCount="indefinite" />
      <animateMotion dur="2s" begin="0s" repeatCount="indefinite"><mpath href="#p-air-in" xlink:href="#p-air-in"/></animateMotion>
    </circle>
    <circle r="3.5" fill="#6bbbff" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2s" begin="1s" repeatCount="indefinite" />
      <animateMotion dur="2s" begin="1s" repeatCount="indefinite"><mpath href="#p-air-in" xlink:href="#p-air-in"/></animateMotion>
    </circle>

    <circle r="3.5" fill="#f0a030" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2s" begin="0.5s" repeatCount="indefinite" />
      <animateMotion dur="2s" begin="0.5s" repeatCount="indefinite"><mpath href="#p-air-out" xlink:href="#p-air-out"/></animateMotion>
    </circle>
    <circle r="3.5" fill="#f0a030" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2s" begin="1.5s" repeatCount="indefinite" />
      <animateMotion dur="2s" begin="1.5s" repeatCount="indefinite"><mpath href="#p-air-out" xlink:href="#p-air-out"/></animateMotion>
    </circle>
  </g>

  <line x1="40" y1="265" x2="340" y2="265" stroke="#0de4a0" stroke-width="1" stroke-dasharray="3 4" opacity="0.3" />
  <text x="190" y="255" text-anchor="middle" fill="#e6edf3" font-size="11" opacity="0.8">অ্যালভিওলাস ও গ্যাস বিনিময় (Alveolus Gas Exchange)</text>

  <g id="micro-view">
    <path d="M 80 370 C 130 460, 250 460, 300 370" fill="none" stroke="url(#cap-grad)" stroke-width="24" opacity="0.35" />
    <path d="M 80 370 C 130 460, 250 460, 300 370" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.5" stroke-dasharray="2 3" />

    <g class="breathe-alveoli">
      <path d="M 175 280 L 175 320 C 120 320, 120 410, 190 415 C 260 410, 260 320, 205 320 L 205 280" fill="#0d1117" stroke="#0de4a0" stroke-width="3" />
      <path d="M 175 320 C 150 340, 150 370, 175 390" fill="none" stroke="#0de4a0" stroke-width="1.5" opacity="0.4"/>
      <path d="M 205 320 C 230 340, 230 370, 205 390" fill="none" stroke="#0de4a0" stroke-width="1.5" opacity="0.4"/>
    </g>

    <text x="70" y="325" text-anchor="end" fill="#e6edf3" font-size="11" font-weight="bold">অ্যালভিওলাস</text>
    <text x="70" y="338" text-anchor="end" fill="#0de4a0" font-size="10">(Alveolus)</text>
    <path d="M 75 330 L 135 345" fill="none" stroke="#f0a030" stroke-width="1" marker-end="url(#arrow)" />

    <text x="310" y="445" text-anchor="start" fill="#e6edf3" font-size="11" font-weight="bold">কৈশিক জালিকা</text>
    <text x="310" y="458" text-anchor="start" fill="#ef4444" font-size="10">(Capillary)</text>
    <path d="M 305 450 L 245 425" fill="none" stroke="#f0a030" stroke-width="1" marker-end="url(#arrow)" />

    <text x="110" y="390" text-anchor="end" fill="#6bbbff" font-size="10">CO₂ যুক্ত রক্ত</text>
    <text x="270" y="390" text-anchor="start" fill="#ef4444" font-size="10">O₂ যুক্ত রক্ত</text>

    <text x="215" y="365" fill="#6bbbff" font-size="12" font-weight="bold">O₂</text>
    <text x="145" y="365" fill="#f0a030" font-size="12" font-weight="bold">CO₂</text>

    <circle r="4" fill="#6bbbff" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="2s" begin="0.2s" repeatCount="indefinite" />
      <animateMotion dur="2s" begin="0.2s" repeatCount="indefinite"><mpath href="#p-micro-o2" xlink:href="#p-micro-o2"/></animateMotion>
    </circle>
    <circle r="4" fill="#6bbbff" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="2s" begin="1.2s" repeatCount="indefinite" />
      <animateMotion dur="2s" begin="1.2s" repeatCount="indefinite"><mpath href="#p-micro-o2" xlink:href="#p-micro-o2"/></animateMotion>
    </circle>

    <circle r="4" fill="#f0a030" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="2s" begin="0.7s" repeatCount="indefinite" />
      <animateMotion dur="2s" begin="0.7s" repeatCount="indefinite"><mpath href="#p-micro-co2" xlink:href="#p-micro-co2"/></animateMotion>
    </circle>
    <circle r="4" fill="#f0a030" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="2s" begin="1.7s" repeatCount="indefinite" />
      <animateMotion dur="2s" begin="1.7s" repeatCount="indefinite"><mpath href="#p-micro-co2" xlink:href="#p-micro-co2"/></animateMotion>
    </circle>

    <g>
      <circle r="5" fill="#6bbbff" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3s" begin="0s" repeatCount="indefinite" />
        <animate attributeName="fill" values="#6bbbff;#ef4444;#ef4444" keyTimes="0;0.6;1" dur="3s" begin="0s" repeatCount="indefinite" />
        <animateMotion dur="3s" begin="0s" repeatCount="indefinite"><mpath href="#p-rbc" xlink:href="#p-rbc"/></animateMotion>
      </circle>
      <circle r="5" fill="#6bbbff" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3s" begin="1s" repeatCount="indefinite" />
        <animate attributeName="fill" values="#6bbbff;#ef4444;#ef4444" keyTimes="0;0.6;1" dur="3s" begin="1s" repeatCount="indefinite" />
        <animateMotion dur="3s" begin="1s" repeatCount="indefinite"><mpath href="#p-rbc" xlink:href="#p-rbc"/></animateMotion>
      </circle>
      <circle r="5" fill="#6bbbff" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3s" begin="2s" repeatCount="indefinite" />
        <animate attributeName="fill" values="#6bbbff;#ef4444;#ef4444" keyTimes="0;0.6;1" dur="3s" begin="2s" repeatCount="indefinite" />
        <animateMotion dur="3s" begin="2s" repeatCount="indefinite"><mpath href="#p-rbc" xlink:href="#p-rbc"/></animateMotion>
      </circle>
    </g>
  </g>
</svg>
